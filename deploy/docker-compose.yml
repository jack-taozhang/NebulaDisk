# =============================================================================
# NebulaDisk 一体化离线部署编排（nebula + onlyoffice + cad-viewer）
#
#   启动：  docker compose up -d
#   日志：  docker compose logs -f nebula
#   停止：  docker compose down
#
#   本文件不依赖 .env，所有参数写死在这里；全部使用本地已导入镜像，
#   因此 docker compose 与 NAS 图形化容器管理器都不会联网拉取。
#
#   文件编码：UTF-8（无 BOM）。★ 请务必保持 UTF-8 ★
#   下面有中文的宿主路径与容器路径，用图形化容器管理器编辑时若被存成
#   GBK/ANSI，路径会乱码、挂载直接失败。
#
# -----------------------------------------------------------------------------
# ★ 本次改动（修复「打开文件时发生错误」）★
#
#   现象：OnlyOffice 编辑器外壳能打开，点文档弹「打开文件时发生错误」，
#        日志（docservice/out.log）报：
#          EACCES: permission denied,
#          mkdir '/tmp/ASC_CONVERT2026821-xxxx'
#          at getTempDir (server/FileConverter/sources/converter.js)
#
#   根因：OnlyOffice 的 FileConverter / DocService **以非 root 用户 ds
#        (uid=101) 运行**（见容器内 /etc/supervisor/conf.d/ds-converter.conf
#        的 `user=ds`）。它需要在 /tmp 下建临时目录，所以 /tmp 必须
#        **世界可写**（other 位要有 w+x，即 1777）。
#
#   ★★ 本文件的 tmpfs 结论在 2026-09-21 修正过一次，两版实测都留档 ★★
#
#   【开发机 D:\Docker】onlyoffice/documentserver:latest  digest 141847e5…
#        镜像自带 /tmp = drwxrwxrwt 0:0  → 不挂 tmpfs 也能用
#   【目标 NAS TPNAS】  onlyoffice/documentserver:latest  digest 3ab6ebc7…
#        **镜像自带 /tmp = drwxr-xr-x 1001:1002**  ← 镜像自身就是错的！
#        同为 :latest，digest 不同 ⇒ 是两个不同构建（这份很可能是被
#        NAS 侧打包/重打过的）。⇒ 在 NAS 上**必须**用 tmpfs 覆盖 /tmp。
#
#   【目标 NAS 的第二个坑】它的 Docker 给 tmpfs 的**默认 mode 是 0755**，
#        不是标准 Docker 的 1777。所以只写 `tmpfs: - /tmp`、或只写 size、
#        或只写 uid/gid 都不行，**必须显式写 mode=1777**。
#
#   在 TPNAS 上以 ds 用户实测（docker run --user ds … mkdir /tmp/x）：
#         镜像自带 /tmp                          drwxr-xr-x 1001:1002  ❌
#         tmpfs: /tmp（不写 mode）                drwxr-xr-x 0:0        ❌
#         tmpfs: /tmp:size=2G（不写 mode）        drwxr-xr-x 0:0        ❌
#         tmpfs: /tmp:mode=1777                  drwxrwxrwt 0:0        ✅
#         tmpfs: …uid=1000,gid=1000,mode=1777    drwxrwxrwt 1000:1000  ✅
#       结论：**必须带 mode=1777**；uid/gid 无意义（ds 是 101，靠 other 位写）。
#
#   ⚠️ 教训：凡属「镜像自带什么 / 内核默认给什么」的结论，
#      **必须在目标机器上实测**。开发机上能用的配置搬到 NAS 不一定成立 ——
#      连同一个 :latest 标签的镜像 digest 都可能不同。
#
#   改动清单：
#     ① onlyoffice 给 /tmp 挂 tmpfs 并**显式 mode=1777**（见 D 段注释）
#     ② 补 JWT_IN_BODY: "true"（与已验证可用的配置对齐）
#     ③ 镜像标签写全为 onlyoffice/documentserver:latest
#     ④ 加 stop_grace_period: 60s（OO 需要时间落盘，免得重启损坏数据）
#     （数据目录**保持宿主目录绑定**：TPNAS 上实测属主是 101:102，
#       ds 可写，不必改成命名卷 —— 改动越少，引入的新变量越少。）
#
#   另外两条必须遵守的（本文件已满足，别改回去）：
#     · 不要给 onlyoffice 设 read_only: true —— converter 要写文件系统
#     · 不要把 onlyoffice 的 user 设成 root 或别的用户 —— 必须用镜像默认
#
#   重建后自检：
#     docker exec onlyoffice ls -ldn /tmp
#       → 必须是 drwxrwxrwt（结尾 t，且 other 段有 w）
#     docker exec onlyoffice su -s /bin/sh ds -c 'mkdir /tmp/__t && echo DS_OK'
#     docker exec nebula curl -s -o /dev/null -w '%{http_code}\n' \
#         http://onlyoffice:80/healthcheck
#       → 200
# =============================================================================

# 项目名**不要**在这里写死。
# compose 会取「当前目录名」作项目名：/vol1/1000/NebulaDisk → nebuladisk，
# 而你这套容器当初就是以 nebuladisk 创建的。
# ★ 若这里写死一个别的名字（例如 name: nebula），compose 会把现有容器当成
#   「不属于本项目」，于是拒绝重建、直接报容器名冲突：
#     Error: container name "/onlyoffice" is already in use
#   这个坑很隐蔽，别加回来。

services:

  # ---------------------------------------------------------------------------
  # NebulaDisk —— 云盘 + kkFileView（单镜像双进程）
  # ---------------------------------------------------------------------------
  nebula:
    image: nebula:1.0.0
    pull_policy: never          # 只用本地已导入的镜像，绝不联网拉取
    container_name: nebula
    restart: unless-stopped

    ports:
      # 云盘界面。宿主机端口 8089，容器内固定 8088。
      - "8089:8088"
      # kkFileView 独立端口（排查用）。不需要可注释掉。
      - "8012:8012"

    volumes:
      # 云盘数据（SQLite 用户库 + 会话密钥，必须持久化）
      - ./data:/var/lib/nebula
      # kkFileView 的转换产物与日志（纯缓存，可随时删，删后需重启容器）
      - ./data-kk/file:/opt/kkFileView-5.0.2/file
      - ./data-kk/log:/opt/kkFileView-5.0.2/log

      # ===== 真实目录映射 =====
      # 左边宿主机路径 : 右边容器内路径
      # 右边必须与下面 NEBULA_MOUNTS 第二段完全一致
      - "/vol1/1000/售前项目:/mnt/售前项目"
      - "/vol1/1000/研发立项:/mnt/研发立项"
      - "/vol1/1000/项目设计:/mnt/项目设计"

    environment:
      TZ: "Asia/Shanghai"

      # ---------------- 目录映射 ----------------
      # 格式：显示名|容器内路径|可见用户   （用 ; 分隔多条）
      NEBULA_MOUNTS: "售前项目|/mnt/售前项目|*;研发立项|/mnt/研发立项|*;项目设计|/mnt/项目设计|*"

      # ---------------- 云盘基础 ----------------
      NEBULA_TITLE: "NebulaDisk"
      NEBULA_DATA_DIR: "/var/lib/nebula"
      NEBULA_PORT: "8088"
      NEBULA_LOG_LEVEL: "info"

      # ★ raw 取流直链的对外基地址（OnlyOffice 容器视角，不是浏览器视角）
      #   容器端口是 8088，不是宿主机映射端口。
      NEBULA_BASE_URL: "http://nebula:8088"

      # ---------------- 管理员账号（首次启动创建）----------------
      NEBULA_ADMIN_USER: ${NB_ADMIN_USER:-tao_zhang}
      # ⚠️ 明文密码。这个文件会跟着镜像包一起流转，建议改成你自己的强密码；
      #    若已将本文件外发过，请把这里的值换掉并重建容器。
      NEBULA_ADMIN_PASSWORD: ${NB_ADMIN_PASSWORD:?set NB_ADMIN_PASSWORD in .env}
      NEBULA_SESSION_HOURS: "12"
      NEBULA_MAX_UPLOAD_MB: "2048"

      # ---------------- 会话密钥 ----------------
      # 留空 = 自动生成到 /var/lib/nebula/secret.key（持久卷，重启不掉线）
      NEBULA_JWT_SECRET: ""

      # ---------------- kkFileView（同镜像内的另一个进程）----------------
      NEBULA_PREVIEW: "http://127.0.0.1:8012"
      NEBULA_PREVIEW_PUBLIC: "/preview"

      # ---------------- OnlyOffice（本编排内置服务）----------------
      # 服务名/容器名都是 onlyoffice，同网络可直接解析。
      # 端口 80 是**容器内**端口，不是宿主机的 8082。
      NEBULA_OO_URL: "http://onlyoffice:80"
      # ★ 浏览器地址：必须是用户浏览器能访问到的地址（NAS 真实 IP + 宿主端口）
      NEBULA_OO_PUBLIC: "http://172.16.30.128:8082"
      # ★ 必须与下面 onlyoffice 服务的 JWT_SECRET 完全一致
      NEBULA_OO_SECRET: ${NB_OO_SECRET:?set NB_OO_SECRET in .env}

      # ---------------- CAD 图纸预览（本编排内置服务）----------------
      NEBULA_CAD_URL: "http://cad-viewer:8080"
      NEBULA_CAD_PROBE: "http://cad-viewer:8080"

      # ---------------- kkFileView 自身参数 ----------------
      JAVA_OPTS: "-XX:MaxRAMPercentage=45.0 -XX:+ExitOnOutOfMemoryError"
      KK_TRUST_HOST: "*"
      KK_BASE_URL: "default"
      KK_CACHE_TYPE: "jdk"
      KK_OFFICE_PREVIEW_TYPE: "pdf"
      KK_OFFICE_QUALITY: "80"
      OFFICE_PLUGIN_SERVER_PORTS: "2001"
      KK_DELETE_PASSWORD: "false"

    # LibreOffice 无头转换用 /dev/shm，默认 64MB 会让 soffice 被 SIGABRT 杀掉
    shm_size: "2gb"

    # kkFileView 要主动抓远程文件，容器内 DNS 必须可用
    dns:
      - 223.5.5.5
      - 119.29.29.29

    deploy:
      resources:
        limits:
          memory: 4g

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

    networks:
      - nebula-net

  # ---------------------------------------------------------------------------
  # OnlyOffice Document Server
  # ---------------------------------------------------------------------------
  onlyoffice:
    image: onlyoffice/documentserver:latest
    pull_policy: never          # 离线环境：只使用本地已导入镜像
    container_name: onlyoffice
    hostname: onlyoffice
    restart: unless-stopped

    ports:
      - "8082:80"

    environment:
      TZ: "Asia/Shanghai"
      # 必须设置密码，否则新版本会自行生成随机密钥导致签名对不上
      JWT_ENABLED: "true"
      JWT_SECRET: ${NB_OO_SECRET:?set NB_OO_SECRET in .env}   # 必须与 NEBULA_OO_SECRET 一致
      JWT_HEADER: "Authorization"
      # 令牌随配置一起放在请求体里；缺了它有的版本读不到 token。
      # 与已验证可用的那套配置保持一致。
      JWT_IN_BODY: "true"

    volumes:
      # 数据目录保持宿主目录绑定（与最初写法一致，改动越小越好）。
      # TPNAS 上实测属主：data = 101:102、lib = 101:102 → ds 可写，够用。
      # 若换机器后出现 EPERM/EACCES，再考虑改成命名卷
      # （命名卷由 Docker 用「镜像内容 + 属主」初始化，更省心）。
      - ./onlyoffice/data:/var/www/onlyoffice/Data
      - ./onlyoffice/logs:/var/log/onlyoffice
      - ./onlyoffice/lib:/var/lib/onlyoffice
      - ./onlyoffice/db:/var/lib/postgresql
      # ★ local.json 不在这里挂载（2026-09-24 已撤回）★
      #   曾把宿主 ./onlyoffice/local.json 绑到容器
      #   /etc/onlyoffice/documentserver/local.json 做持久化，实测**会破坏 OO 启动**：
      #   entrypoint 每次启动都要用 `json -I -f local.json -e ...` 回写该文件
      #   （先写临时文件再 rename），而 bind mount 的挂载点不能被 rename 覆盖 →
      #     EBUSY: resource busy or locked,
      #     rename '.local.json-json-*.tmp' -> 'local.json'
      #   ⇒ 配置注入失败。故撤回。
      #   大文件限制改用「容器内改 local.json + docker restart」的临时方式，
      #   容器重建/镜像升级后需重打；备份留在宿主 ./onlyoffice/local.json。

    # ★★ /tmp 必须挂 tmpfs，且**必须显式写 mode=1777** ★★
    #
    #   本 NAS 上这份 OO 镜像自带的 /tmp 是 drwxr-xr-x（0755，属主 1001:1002），
    #   而 converter 以 ds(uid=101) 运行 → 在 /tmp 下建不了临时目录 →
    #   EACCES mkdir '/tmp/ASC_CONVERT...' → 文档永远打不开。
    #
    #   ⚠️ 本机（TPNAS）的 Docker 给 tmpfs 的**默认 mode 是 0755**，
    #      不是标准 Docker 的 1777。所以下面这行**不能**简写成：
    #          - /tmp                 ← 实测得到 drwxr-xr-x，仍然 ❌
    #          - /tmp:size=2G         ← 同样 drwxr-xr-x，❌
    #      必须带上 mode=1777。实测对照见文件头「本次改动」。
    tmpfs:
      - /tmp:rw,exec,size=2G,mode=1777

    # 转换大文件若报 /dev/shm 不足，再放开下面这行（默认 64MB）：
    # shm_size: "2gb"

    # OO 停止时要把内存里的文档落盘，给足时间，避免重启损坏
    stop_grace_period: 60s

    networks:
      - nebula-net

  # ---------------------------------------------------------------------------
  # CAD 图纸查看器（nebula/cad-viewer）
  # ---------------------------------------------------------------------------
  cad-viewer:
    image: nebula/cad-viewer:1.7.0
    pull_policy: never          # 离线环境：只使用本地已导入镜像
    container_name: cad-viewer
    restart: unless-stopped

    ports:
      # 浏览器可直接访问（可选，不需要可注释掉；云盘是通过容器名代理的）
      - "8090:8080"

    environment:
      TZ: "Asia/Shanghai"
      NODE_ENV: "production"
      PORT: "8080"

    # 无状态：不挂任何卷。文件读写都在 nebula 容器里，
    # 升级/重建/卸载查看器都不碰数据。

    networks:
      - nebula-net

# -----------------------------------------------------------------------------
# 统一内部网络：nebula / onlyoffice / cad-viewer 相互通过服务名访问
# -----------------------------------------------------------------------------
networks:
  nebula-net:
    name: nebula-net
    driver: bridge
