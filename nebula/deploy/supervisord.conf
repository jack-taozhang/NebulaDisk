; =============================================================================
; NebulaDisk 单镜像双进程编排（supervisord）
;
; 一个容器里跑两个进程：
;   nginx   :80    前门（反代）：OO 静态资源/WS/缓存、静态资源缓存头、Host 协议修正
;   nebula  :8088  Python FastAPI，仿 Windows 云盘界面 + 目录映射 + 鉴权
;
; ★ 2026-10-04 变更 ★
;   改前：kkfileview(8012) + nebula(8088) 同容器；
;   改后：KK 剥离成独立容器（见 deploy/docker-compose.yml 的 kkfileview 服务），
;         反代 nginx 并进来 —— 理由是那份 conf 与应用的取值方式是一对，分开必漂移。
;
; 为什么用 supervisord 而不是自己写 shell：
;   - 两个进程都要能独立重启（nginx 崩了不该拖垮云盘）
;   - 都要把 stdout/stderr 收进同一份日志，docker logs 一次看全
;   - 都要在容器收到 SIGTERM 时被优雅停掉
;   shell 里容易漏掉信号转发，supervisord 原生处理。
;
; 注：OnlyOffice / kkFileView / cad-viewer **都不在**这个镜像里。它们作为独立容器，
;     通过同名 docker 网络与本容器互通，见 docker-compose.yml。
; =============================================================================

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
logfile_backups=0
loglevel=info

; ---------------------------------------------------------------------------
; 管理套接字：有了它才能在容器里跑 supervisorctl 看进程状态
;   docker exec nebula supervisorctl status
; 不配的话 supervisorctl 会报 "Error: .ini file does not include
; supervisorctl section"，出问题时只能靠 ps 猜，很不方便。
; ---------------------------------------------------------------------------
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---------------------------------------------------------------------------
; nginx —— 前门（反代）
;
; 为什么 priority 最小（最先起）：应用起来时前门已就绪，首屏不会先被拒一次。
; 为什么 stopsignal=QUIT：nginx 的优雅退出是 QUIT（TERM 是快速退出），
;   用 QUIT 能让正在转发的请求（含 OO 的 WS、大文件下载）收尾。
;   stopwaitsecs 给够，别把正在搬的 8MB 静态资源掐断。
; ---------------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=QUIT
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

; ---------------------------------------------------------------------------
; NebulaDisk —— 云盘本体
; ---------------------------------------------------------------------------
[program:nebula]
command=/usr/local/bin/nebula-entrypoint.sh
directory=/opt/nebula
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
; 容器内存吃紧时优先保住 nebula（它只占几十 MB，是用户入口）。
; kkFileView 转换会吃内存，OOM 杀掉也比界面打不开强。
; 注意：只在内存 cgroup 生效，属尽力而为。

; ---------------------------------------------------------------------------
; 事件监听：进程异常退出时打一行显式日志，便于 docker logs 里定位
;
;   ⚠️ 本段**不能**出现「重定向标准错误」那个配置项。supervisord 靠 stderr
;      与监听器通信，一旦重定向就破坏协议，supervisord 会直接拒绝启动。
;      所以监听器内部只能往 stdout 打印。
;
;   ⚠️ 另一条坑：supervisord 的解析器把 ; 当作**行内**注释符
;      （inline_comment_prefixes=(';','#')），所以**注释里也不要写出
;      配置项全名**，否则可能被当成真实配置读进去。这里刻意用中文描述代替。
;
;   ⚠️ 监听器若以非零码退出，supervisord 会不停重启并刷屏。脚本里已捕获
;      全部异常；下方 autorestart=false + startretries=1 保证不会无限重启。
; ---------------------------------------------------------------------------
[eventlistener:exitmon]
command=/usr/local/bin/supervisor-exitmon.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
autostart=true
autorestart=false
startretries=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
