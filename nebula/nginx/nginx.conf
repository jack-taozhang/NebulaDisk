# ===========================================================================
#  nebula 容器内 nginx 的主配置（打进镜像的 /etc/nginx/nginx.conf）
#
#  为什么要接管主配置，而不是继续用 nginx:alpine 自带的那份：
#
#    `proxy_cache_path` **只能出现在 http 上下文**。
#    而 conf.d/*.conf 里的内容是被 include 到 http 里面的 ——
#    也就是说，试图在 conf.d 的 server 块里写 proxy_cache_path 会直接报
#        "proxy_cache_path directive is not allowed here"
#    ⇒ 必须自己提供一份 nginx.conf，把 proxy_cache_path 写在 http 层，
#      而且必须放在 `include /etc/nginx/conf.d/*.conf;` **之前** ——
#      否则 server 里引用 oo_cache 会报 "unknown zone"。
#
#  其余内容与 nginx:alpine 官方默认基本一致，只做了两处实质改动：
#    ① 新增 proxy_cache_path（OnlyOffice 静态资源缓存）
#    ② access_log 加了缓存命中状态，便于用日志判断"到底吃到缓存没有"
#
#  ⚠️ 这里**故意不开 gzip**：
#     OO 自己已经把资源 gzip 了（sdk-all.js 4.7MB vs 未压缩 28.8MB），
#     我们在前面再 gzip 一次就是拿已压缩内容再压，白烧 CPU 且几乎没收益。
#     保持不动 = 原样透传上游编码，这才是对的。
# ===========================================================================

# ★ 2026-10-04：从 `nginx` 改成 `www-data` ★
#   配置原跑在 nginx:1.27-alpine 容器里，那边有 `nginx` 用户；
#   现在并进 ubuntu:24.04 底包、用 apt 装的 nginx ⇒ 只有 `www-data`。
#   不改的话 nginx 直接起不来：getpwnam("nginx") failed。
user  www-data;
worker_processes  auto;

# 容器默认的 nofile 是 1024，而 worker_connections 2048 会超过它
# （nginx -t 会给 [warn] exceed open file resource limit）。
# 编辑器冷启动会同时开几百个连接（250+ 请求），这里一起提上去。
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 把缓存命中状态写进访问日志：排查"为什么还是慢"时一眼能看出
    # 是 HIT（吃到缓存）还是 MISS/BYPASS（回源了）。
    # xfp/xfh = 上游（飞牛 FN Connect 网关）传来的 X-Forwarded-Proto / Host。
    # ★ 专门记下来排查「HTTPS 访问被算成 HTTP」那类问题：
    #   为空 ⇒ 说明网关没传协议，只能靠 Host 判断或改成相对路径。
    # ua/ref 是 2026-10-03 为排查「手机 FN App 打开 Office 报下载失败」加的：
    #   所有外部请求经 docker-proxy 进来后 $remote_addr 都是网关地址（如 172.21.0.1），
    #   **用 IP 区分不出手机和电脑** ⇒ 只能靠 UA / Referer。
    #   （UA 放在引号里，它本身含空格。）
    # ★ ae= 是 2026-10-03 为定位「手机拿到 28.8MB 未压缩 JS」加的：
    #   飞牛 App 的 webview/代理层**不发 Accept-Encoding** ⇒ 命中缓存里的
    #   未压缩变体 ⇒ 白下 6 倍流量。有 ae= 就能在日志里一眼确认。
    log_format  main  '$remote_addr - [$time_local] "$request" $status '
                      '$body_bytes_sent cache=$upstream_cache_status '
                      'rt=$request_time urt=$upstream_response_time '
                      'host=$http_host fwd=$fwd_host '
                      'xfp=$http_x_forwarded_proto xfh=$http_x_forwarded_host '
                      'ae="$http_accept_encoding" ua="$http_user_agent" ref="$http_referer"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # -----------------------------------------------------------------------
    #  ★ 兜底 gzip（2026-10-03 加）★
    #
    #  为什么要加：实测**飞牛手机 App 的 webview/代理层不发 Accept-Encoding**。
    #  铁证（同一份 sdkjs/word/sdk-all.js，同一时刻）：
    #    · 电脑 Chrome（带 AE）→ 4,712,240 B、Content-Encoding: gzip
    #    · 飞牛手机 App（无 AE）→ 28,867,246 B、无 Content-Encoding
    #  而 _oo-cache.inc 的 proxy_cache_key 含 $http_accept_encoding
    #  ⇒ 两者命中**不同缓存变体**，手机每次都白发 6 倍流量。
    #  ⇒ 28.8MB 的大 JS 在移动端解析慢/吃内存 ⇒ 编辑器起不来、
    #    报「下载失败」，而**这跟网速无关**（实测 rt=0.84s 就传完了
    #    28.8MB ≈ 34MB/s，是"字数"问题不是"带宽"问题）。
    #
    #  为什么不和"OO 自己已 gzip"冲突：
    #    `gzip on` **只对上游没给 Content-Encoding 的响应生效**。
    #    上游已经压好的（电脑那种带 AE 的请求）原样透传，
    #    nginx 检测到 Content-Encoding 就**不会二次压缩**。
    #  ⇒ 电脑走"上游预压缩"（零 CPU），手机走"nginx 现场压"（各取所需）。
    #
    #  ⚠️ `gzip_proxied any` 必须显式写：它的默认值是 off，
    #     而飞牛 App 是「客户端 → App 代理 → 本 nginx」两跳，
    #     请求头里可能带 Via ⇒ 默认策略会**拒绝压缩**，等于白加。
    # -----------------------------------------------------------------------
    gzip  on;
    gzip_proxied  any;
    gzip_vary  on;
    gzip_comp_level  6;
    gzip_min_length  1024;
    # ⚠️ 故意不含 image/png、image/jpeg、application/zip 等**已压缩**类型：
    #    再压一遍纯烧 CPU，体积几乎不变。
    gzip_types  text/plain text/css text/xml
                application/json application/javascript application/x-javascript
                text/javascript application/xml image/svg+xml;

    # -----------------------------------------------------------------------
    #  ★ OnlyOffice 静态资源缓存（2026-10-03）★
    #
    #  依据（实测 OO 的响应头，不是猜的）：
    #    sdkjs/*.js、web-apps/*、fonts/*  →  Cache-Control: public, max-age=31536000, immutable
    #    web-apps/apps/api/documents/api.js（版本前缀下）→  no-store, no-cache
    #  ⇒ 我们**不设 proxy_cache_valid**，完全让 OO 自己声明的话说了算：
    #     声明 immutable 的会被缓存一年（并因此被 own 的 no-store 规则排除在外）。
    #     如果哪天 OO 改了策略，我们这里自动跟随，不会自作主张。
    #
    #  ⚠️ 为什么 max_size 给到 3g：
    #     单 sdkjs/word/sdk-all.js 未压缩就 28.8MB，而 key 里带了
    #     Accept-Encoding（见 _oo-cache.inc），压缩/未压缩各存一份。
    #     整套 OO 前端资源约 200~400MB，3g 对 SSD 来说很便宜。
    # -----------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/oo
                     levels=1:2
                     keys_zone=oo_cache:128m
                     max_size=3g
                     inactive=60d
                     use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
