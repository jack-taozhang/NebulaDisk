# ===========================================================================
#  NebulaDisk 前门（nginx）—— 让 OO 的静态资源/WS 不再穿过 Python
#
#  ★ 2026-10-04 起：本配置**打进 nebula 镜像**，由 supervisord 当第二个进程拉起 ★
#     以前它跑在独立容器 nebula-front（nginx:1.27-alpine）+ 宿主目录绑定挂载。
#     合并的理由：这份配置与应用的取值/头部协议是**一对**（见下面三条铁律），
#     分开存放必然漂移（曾出现「只传了 conf 没传它 include 的 .inc ⇒ nginx -t 通过
#     但改动一点没生效」）。并进镜像后两者同版本、同发布节奏。
#     · 容器内监听 80；compose 把宿主机 8089 映到它
#     · upstream app_up 指向 127.0.0.1:8088（应用同容器）
#
#  为什么要有这一层（2026-10-03 实测）：
#    OnlyOffice 编辑器**冷启动要发 250+ 个请求**（单 sdk-all.js 未压缩 28.8MB）。
#    把 `oo_public` 清空改成"同源"之后，这些请求全部落到 NebulaDisk 这个
#    **单进程 Python 反代**上（ASGI + httpx + 流式转发，实测 3~12ms/请求）
#    ⇒ 用户从"秒开"退化成 **~25 秒**。
#    nginx 处理同样的请求是**亚毫秒**级，且 WS / keep-alive / gzip / 缓存
#    全是原生能力 ⇒ 这一层是正解，不是优化。
#
#  三条铁律（都踩过，别改回去）：
#    1. **`proxy_set_header Host $http_host;`** —— 不转发原始 Host，
#       OO 会用上游名 `onlyoffice` 拼**绝对 URL**（文档二进制、静态资源），
#       浏览器拿到 `http://onlyoffice/...` 必然解析失败 ⇒ 编辑器弹「下载失败」。
#    2. **别动 `Content-Encoding`** —— OO 发的是 gzip，透传才能省 6 倍体积
#       （sdk-all.js 4.7MB vs 28.8MB）。nginx 默认就不动上游编码，别去加 gzip 指令。
#    3. **版本前缀原样透传，不需要任何改写** —— OO 自己认识
#       `/9.4.0-<hash>/web-apps/...` 这种路径（直接打它也是 200）。
#       应用里那个"版本前缀中间件"在 nginx 这套里**完全不需要**。
#
#  路由分工：
#    OO 的静态资源（带/不带版本前缀）  → onlyoffice + **服务端缓存**
#    OO 的其余前缀 + 版本前缀 + /doc(WS) → onlyoffice   （不缓存）
#    其余一切（页面 / /api / /preview(KK) / /cad / /website） → nebula
#      · KK（kkfileview:8012）自 2026-10-04 起是**独立容器**，但仍由应用
#        统一代理（应用会注入 X-Base-Url 等改写）⇒ 前端这一层不直接接 KK，
#        **不能瞎绕**。
#
#  ④ 服务端缓存（2026-10-03 加强）：
#    浏览器缓存对"第一次打开""换设备""换浏览器"都不起作用，而跨 ZeroTier
#    搬 ~8MB 资源就是那几秒的来源 ⇒ 在 nginx 这一层再存一份。
#    · 存什么：**只存 OO 自己声明 immutable 的静态资源**（跟随上游
#      Cache-Control，我们不自作主张设 proxy_cache_valid）
#    · 存哪儿：nginx.conf 里的 proxy_cache_path
#    · 策略在 _oo-cache.inc（含"cache key 必须带 Accept-Encoding"这条血泪）
#    · 清缓存：docker exec nebula rm -rf /var/cache/nginx/oo/*
# ===========================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# ★★ 原始协议：必须**继承上游**，不能无条件用 $scheme ★★（2026-10-03 修）
#
#  症状：飞牛桌面（FN Connect，https://<app>.<user>.fnos.net）里打开 Office 文件，
#        编辑器报「OnlyOffice 不可达 / 无法加载接口脚本」，而那条 URL 是
#        `http://nebula-disk-main.alumaple.fnos.net/web-apps/...` —— **http**。
#        HTTPS 页面加载 HTTP 脚本 = **混合内容，浏览器直接拦掉**。
#
#  成因：应用侧 `_origin()` 的算法是
#            proto = request.headers.get("x-forwarded-proto") or request.url.scheme
#        本身没问题；但**我们自己在反代里写死了 `X-Forwarded-Proto $scheme`**。
#        front 容器监听 80，TLS 是飞牛网关在前面终止的 ⇒ $scheme 恒为 http
#        ⇒ **即使飞牛传了 https 也被我们覆盖成 http**。
#
#  修法：上游给了就用上游的，没给才退回 $scheme。
#        （`$http_x_forwarded_proto` 为空时，map 取 '' 分支 ⇒ 与旧行为一致，不会更糟。）
# ---------------------------------------------------------------------------
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ---------------------------------------------------------------------------
# ★★ 还原「浏览器实际使用的 origin」（2026-10-03）★★
#
#  症状：**手机（飞牛 App）**打开 Office 文件，OnlyOffice 弹
#        「下载失败 / 点击确定关闭编辑器」，而电脑完全正常。
#
#  实测到的矛盾（nebula-front 的访问日志，465 条手机请求全部一致）：
#      host=nebuladisk-main.alumaple.fnos.net   xfp=https
#   而同一批请求的 Referer（= 浏览器里页面真实地址）是
#      https://office.app.5ddd.com:35359/
#  ⇒ **飞牛 App 的 webview 代理改写了 Host 头，却没改 Referer。**
#
#  ⇒ 我们（以及后端的 `_origin()`，见 webutil.py）都按 Host 拼绝对地址：
#     · apiJs      = https://nebuladisk-main.alumaple.fnos.net/web-apps/...
#     · OO 容器也按收到的 Host 生成文档下载地址（/cache/files/<key>/Editor.bin）
#  ⇒ 于是编辑器 iframe 里的文档下载请求被指向 nebuladisk-main 域，
#     而 App 的 webview 只认它的代理域 office.app.5ddd.com
#  ⇒ 这些请求**一条都没发出去**（所以 nginx 日志里 0 条 Editor.bin），
#     OO 只能报「下载失败」。
#  铁证：手机请求 Editor.bin = **0 条**、/cache/files = **0 条**、/api/raw = 0 条，
#        而同期电脑分别是 8 / 115 / 若干条；OO 侧 callback 却是 `status=1`（文档已打开）。
#
#  修法：Referer 里的 origin 才是**浏览器真正在用的地址**，用它覆盖传给上游的
#        Host / X-Forwarded-Host / X-Forwarded-Proto。
#        （X-Forwarded-Host 正是 `_origin()` 的第一优先级来源。）
#
#  ⚠️ 为什么这样改不会影响电脑：
#     · 电脑直连 `https://nebuladisk-main.alumaple.fnos.net` ⇒ Referer origin
#       就是这个域 ⇒ 与原来的 $http_host **完全相同**，行为不变。
#     · 电脑用 `http://192.168.193.70:8089` ⇒ 同理，不变。
#     · 没有 Referer 的请求（如 fetch/api 的裸调用）⇒ 回退到原 $http_host。
#     ⇒ 只有在「Host 与浏览器真实地址不一致」时才会生效 —— 正是要修的那种场景。
# ---------------------------------------------------------------------------
map $http_referer $ref_origin_host {
    default                                     "";
    "~^https?://([^/]+)"                        "$1";
}
map $http_referer $ref_origin_scheme {
    default                                     "";
    "~^(https?)://"                             "$1";
}

# 传给上游的 Host：**Referer 优先**（浏览器当前地址，最新鲜），其次 Cookie，最后原始 Host
#
#  ★ 为什么 Cookie 要退居第二（2026-10-03 踩坑后改）★
#    Cookie 是**跨会话持久**的，而飞牛 App 的端口是**按会话分配**的
#    （实测见过 34043 / 42651 / 46023）。Cookie 又不区分端口 ⇒
#    上一次会话写下的 `oo_host=<旧端口>` 会一直留着，于是**新会话里生成的绝对地址
#    指向上一次会话的端口** ⇒ 浏览器跨源取不到 ⇒ CAD 一直转圈。
#    实测证据：`/api/cad/preview` 请求 `fwd=office.app.5ddd.com:34043`（旧 Cookie）
#              而 `ref="https://office.app.5ddd.com:46023/"`（真实当前地址）。
#    ⇒ Referer 永远反映「浏览器此刻在哪」，比 Cookie 可靠；Cookie 只作兜底，
#      覆盖**没有 Referer** 的请求（WebSocket 握手 —— 这正是当初引入 Cookie 的原因）。
#  ★ 安全：cookie 值走白名单正则，只接受合法 host 形状，避免被塞进 header。
map $cookie_oo_host $oo_host_cookie {
    default                  "";
    "~^[A-Za-z0-9._:\[\]-]+$"  $cookie_oo_host;
}
map $cookie_oo_proto $oo_proto_cookie {
    default       "";
    "~^(https?)$" "$1";
}
map "$ref_origin_host|$oo_host_cookie" $fwd_host {
    default         $http_host;
    "~^([^|]+)\|"   "$1";        # Referer 有值 ⇒ 用它（浏览器当前地址）
    "~^\|([^|]+)$"  "$1";        # 无 Referer（如 WS）⇒ 回退到 Cookie
}
# 传给上游的协议：同理（Referer 的 scheme > Cookie > 网关传的 xfp）
map "$ref_origin_scheme|$oo_proto_cookie" $fwd_proto {
    default         $forwarded_proto;
    "~^([^|]+)\|"   "$1";
    "~^\|([^|]+)$"  "$1";
}

# ---------------------------------------------------------------------------
# ★★ 兜底：手机 webview 里 OO 编辑器的「裸相对路径」（2026-10-03）★★
#
#  症状：手机（飞牛 App）打开 Office 报 OnlyOffice 的「语言没有加载」。
#  客户端探针实测（`__oodiag__` 回传，见 D:/Docker/.workbuddy/memory/2026-10-03.md）：
#    · iframe-url: { src: ".../9.4.0-<hash>/web-apps/apps/spreadsheeteditor/main/",
#                    loc: "about:blank",              ← ★ iframe 实际停在 about:blank
#                    base: "https://office.app.5ddd.com:35359/" }   ← ★ baseURI 变成根
#    · fetch-bad: 404 `locale/zh.json` / `locale/en.json`
#                404 `./resources/img/icons{huge,small,big}@2.5x.svg`
#                404 `../../common/main/resources/img/doc-formats/formats@2.5x.svg`
#  ⇒ iframe 停在 about:blank ⇒ 它的 `document.baseURI` 是**父页面**（网盘首页，根路径）
#    ⇒ 编辑器里所有**相对** fetch 都解析到根 ⇒ 404 ⇒ 语言/图标加载失败。
#  ⚠️ 电脑（真 Chrome）不会这样（同一份 OO 资源，电脑**零 404**），
#     所以这是**飞牛 App webview 的特性**，属于第三方环境问题，OO 镜像里的文件不能改。
#
#  修法：在这里把落到根上的这几类路径**补回正确前缀**再转给 OO。
#    · `/locale/<x>.json`、`/resources/<x>` → `/web-apps/apps/<app>/main/…`
#      （`<app>` 从**发起方 iframe 的 Referer** 里取：documenteditor /
#        spreadsheeteditor / presentationeditor —— 否则不知道是哪个编辑器）
#    · `/common/<x>` → `/web-apps/apps/common/<x>`（这个前缀是固定的）
#
#  ⚠️ 安全阀：认不出「是哪个编辑器」时一律维持原来的 404，
#     避免抢走网盘自己将来可能用到的同名路径。
#  ⚠️ 不写版本前缀也可以：OO 的 nginx 对 `/web-apps/apps/...` 不带版本号同样放行
#     （api.js 本身就是这么取的，实测 200）。
#
#  ★★ app 名怎么识别（这是本方案的关键，踩过一回）★★
#  第一版只看 `Referer`，**失败**：手机这些裸路径请求的 Referer 是
#  `https://<host>/`（父页面根地址），**根本没有 app 名** ——
#  因为 OO 的 iframe 停在 about:blank，它发请求时带的是父页面的 URL。
#  结果安全阀把它们全挡成 404（响应体 555B、`urt=-` 没到上游，一眼能认出）。
#  ⇒ 改由**父页面（web/js/viewer.js）把 app 名写进 Cookie `oo_app`**，nginx 读它。
#    （三个编辑器的 locale 文件内容各不相同 —— 已 md5 核对 —— 所以不能随便挑一个兜底。）
#  ⇒ Referer 仍然保留作为**第二优先级**（真浏览器/将来别的场景可能带得出 app 名）。
map $cookie_oo_app $oo_app_cookie {
    default        "";
    "~^([a-z]+)$"  "$1";            # 白名单：只接受纯小写字母，防注入
}
map $http_referer $oo_app_ref {
    default "";
    "~web-apps/apps/([a-z]+)/main/"  "$1";
}
# 最终：Cookie 优先，其次 Referer
map "$oo_app_cookie|$oo_app_ref" $oo_ref_app {
    default          "";
    "~^([^|]+)\|"    "$1";
    "~^\|(.+)$"      "$1";
}

# ★★ 只让「成功」响应继承上游的 Cache-Control；4xx/5xx 强制 no-store ★★
#
#   背景（2026-10-04 实测）：上游 OO 的 nginx 给**所有**响应都发
#       `Cache-Control: public, max-age=31536000, immutable`
#   —— **包括 404**。同一个不存在的路径连请求 3 次：
#       第 1 次 `MISS` → 第 2、3 次 `cf-cache-status: HIT`（Age 递增）
#   ⇒ 一个 404 会被 Cloudflare 边缘 **和** 浏览器同时钉住**一年**。
#
#   真实风险：OO 重启 / 上游抖动期间某个资源短暂 404 就被缓存一年
#   ⇒ 编辑器长期打不开，且只有用户手动清缓存才能恢复。
#
#   ⇒ 这里按**状态码**分流：2xx/3xx 原样跟随上游（OO 才是权威：
#     静态资源 immutable 一年、api.js no-store），4xx/5xx 一律 no-store。
#   ⚠️ 用 `$upstream_http_cache_control` **回读上游原值**，不凭猜重写 ——
#      否则会把 api.js 的 no-store 变成可缓存，反而更糟。
#   ⚠️ `$upstream_status` 在有重试时可能是 `"200, 404"` 这种形式，
#      所以用**前缀**匹配 `~^[45]` 而不是精确等于。
map $upstream_status $oo_cc_safe {
    default              $upstream_http_cache_control;
    "~^[45]"             "no-store";
}

# ★ 同一个判据，用来管**我们自己的** proxy_cache 存不存 ★
#   `add_header` 只影响发给客户端的头，**改不了 nginx 自己的缓存决策**
#   （那一步看的是**上游**的 Cache-Control）。所以错误码要单独用
#   `proxy_no_cache` 拦一次，否则 CF 那层修好了、我们这一层还在缓存 404。
#   ⚠️ `proxy_no_cache` 是在「保存响应」时求值的，所以这里能读到
#      `$upstream_status`；而 `proxy_cache_bypass` 是**请求前**求值，
#      那里读它恒为空 —— 两个别搞混。
map $upstream_status $oo_no_cache {
    default              0;
    "~^[45]"             1;
}

upstream oo_up {
    server onlyoffice:80;
    keepalive 32;                 # 复用上游连接，省掉每请求的 TCP 握手
    keepalive_requests 1000;
}
upstream app_up {
    server 127.0.0.1:8088;          # ★ 同容器：反代与 app 在同一个容器里 ★
    keepalive 32;
    keepalive_requests 1000;
}

# ★ 上传：网盘允许 2048MB，nginx 默认 1MB 会把上传直接挡掉 ★
client_max_body_size 2048m;

# 大文件/大图：别让默认 60s 读超时把慢一点的响应掐掉
proxy_connect_timeout 15s;
proxy_send_timeout    600s;

server {
    listen 80 default_server;
    server_name _;

    # ----------------------------------------------------------------
    # ①a ★ 唯一享受缓存的入口：OO 的**静态资源** ★
    #
    #     路径形如（版本前缀可选，OO 两种都认）：
    #        /9.4.0-<buildhash>/sdkjs/word/sdk-all.js      ← 编辑器实际用这种
    #        /sdkjs/word/sdk-all.js                        ← 去前缀也能访问
    #
    #     ⚠️ 这条必须排在 ①b/② **前面**：nginx 的正则 location 是
    #        **先匹配先赢**（不是最长匹配），顺序写反就被 ①b 抢走、缓存失效。
    #
    #     只列真正不可变的静态目录（sdkjs / web-apps / fonts / themes /
    #     sdkjs-plugins）。下面这些**故意不收**：
    #       · /doc/…      → WebSocket 协作通道，绝不能缓存
    #       · /cache/…    → 文档二进制（Editor.bin），按会话生成，不缓存
    #       · /coauthoring、/downloadas、/internalapi … → 服务端接口，不缓存
    # ----------------------------------------------------------------
    location ~ ^/(?:\d+\.\d+\.\d+-[0-9a-fA-F]+/)?(?:web-apps|sdkjs|sdkjs-plugins|fonts|themes)/ {
        proxy_pass http://oo_up;
        include /etc/nginx/conf.d/_oo-proxy.inc;
        include /etc/nginx/conf.d/_oo-cache.inc;
    }

    # ----------------------------------------------------------------
    # ①b OO 的「版本前缀」路径：/<x.y.z>-<buildhash>/...
    #    原样透传给 OO（它自己的 URL 空间里这条路径是有效的），
    #    所以既不用改写、也不会和自己应用的其它路由抢匹配。
    #    ⚠️ 不缓存：这条下面既有 /doc/ 的 WS，也有 /cache/files/ 的文档二进制。
    # ----------------------------------------------------------------
    location ~ ^/\d+\.\d+\.\d+-[0-9a-fA-F]+(/|$) {
        proxy_pass http://oo_up;
        include /etc/nginx/conf.d/_oo-proxy.inc;
        # 文档二进制可能几十 MB：边收边发，不落临时盘、不占内存
        proxy_buffering off;
    }

    # ----------------------------------------------------------------
    # ② OO 的各个顶层前缀（含 /doc —— 编辑器的 WebSocket 协作通道）
    #    前缀取自应用里的 `_OO_PREFIXES`，一一对应，别漏。
    #    注意：①a 已把其中五个静态目录挑走了，这里留着它们是给
    #    **不带缓存**的那几种路径兜底（顺序在 ①a 之后，不会抢缓存）。
    #
    #    ★ 2026-10-03 补两个漏掉的（都是浏览器会直接请求的）★
    #      · downloadfile/…  —— OO 编辑器的「下载」按钮 POST /downloadfile/<key>。
    #        实测（手机 + 电脑都一样）：编辑器里点下载 → 404（22B 的 FastAPI JSON）
    #        ⇒ 功能直接没用。来源页面是 OO 自己的
    #        `/9.4.0-<hash>/web-apps/apps/common/index.html`（ref 可证），
    #        而 OO 容器内 `POST /downloadfile/<key>` 返回 403（=端点存在，只是 key 不符）
    #        ⇒ 纯粹是网关没代理这条前缀。
    #      · themes\.json    —— OO 的主题清单，GET 实测 200。
    #        注意不能靠上面的 `themes`（那条要求后面紧跟 `/` 或结尾，
    #        而这里是 `.json`），必须单列。
    #
    #    ★ 补漏的方法（下次照做）★
    #      把全量 access log 里所有 404 的**根级路径**列出来，逐个到 OO 容器里
    #      直连试一下：返回 200/403（而不是 OO 的 404 页）就说明该路径属于 OO，
    #      补进来即可。命令见技能 `onlyoffice-embed-troubleshooting`。
    # ----------------------------------------------------------------
    location ~ ^/(web-apps|sdkjs|sdkjs-plugins|fonts|themes|cache|coauthoring|downloadas|downloadfile|themes\.json|internalapi|hosting|integration|spellchecker|doc)(/|$) {
        proxy_pass http://oo_up;
        include /etc/nginx/conf.d/_oo-proxy.inc;
        # /cache/files/… 的文档二进制与 /doc/ 的 WS 都不需要缓冲
        proxy_buffering off;
    }

    # ----------------------------------------------------------------
    # ③a ★ 兜底：手机 webview 把 OO 的相对路径解析到了根（2026-10-03）★
    #     详见文件顶部 `$oo_ref_app` 那段长注释。这里只做「补前缀 + 转给 OO」。
    #     ⚠️ 必须排在 `location /` 之前（正则 location 先匹配先赢）。
    #     ⚠️ 安全阀：Referer 认不出是 OO 编辑器时（$oo_ref_app 为空）一律 404，
    #        绝不抢网盘自己的路径。
    # ----------------------------------------------------------------
    # `/common/...`（例如 ../../common/main/resources/img/... 被解析成根）
    location ~ ^/common(/.*)$ {
        if ($oo_ref_app = "") { return 404; }
        rewrite ^/common(/.*)$ /web-apps/apps/common$1 break;
        proxy_pass http://oo_up;
        include /etc/nginx/conf.d/_oo-proxy.inc;
    }
    # `/locale/...` 与 `/resources/...` —— 要按发起它的那个编辑器补 app 前缀
    location ~ ^/(locale|resources)(/.*)$ {
        if ($oo_ref_app = "") { return 404; }
        rewrite ^/(locale|resources)(/.*)$ /web-apps/apps/$oo_ref_app/main/$1$2 break;
        proxy_pass http://oo_up;
        include /etc/nginx/conf.d/_oo-proxy.inc;
    }

    # ----------------------------------------------------------------
    # ③ 其余全部交给 NebulaDisk 应用
    #    包含：页面、/api/*、/preview/*(kkFileView)、/cad/*、/website/*
    #    WebSocket 也一并转发（应用自身若有 WS 路由也才不会被拦）。
    # ----------------------------------------------------------------
    # ----------------------------------------------------------------
    # ⓪ 网盘自身的静态资源（/static/js|css/*）—— 让 CF 边缘能真正缓存
    #
    #   ★ 为什么单列这一条（2026-10-03）★
    #     应用对 /static/* 返回的是 `Cache-Control: no-cache`，语义是
    #     「可以缓存、但每次必须回源验证」。于是 Cloudflare 的
    #     `cf-cache-status` 永远是 **REVALIDATED**（有缓存却每次都回源）
    #     ⇒ 白多一个「中国 ↔ CF 边缘」的往返。
    #
    #     实测（本次首字节延迟分解）：一次跨太平洋 RTT ≈ 1~1.5s，
    #     而网盘首屏要加载 6~8 个 /static/*.js|css ⇒ **多等 6~12 秒**。
    #
    #   ★ 取值为什么是 max-age=0 + s-maxage=300 ★
    #     · `s-maxage` 只作用于**共享缓存 = Cloudflare**：5 分钟内直接 HIT，
    #       不再回源。多访客共享，第一个人预热、后面的人都受益。
    #     · `max-age=0` 让**浏览器**每次都验证 —— 保证前端一改就能看到，
    #       不被长期浏览器缓存粘住。
    #     · `stale-while-revalidate` 让 CF 过期后**先给旧的、后台再刷新**，
    #       用户永远不用等 revalidate。
    #
    #   ⚠️ TTL 故意只给 5 分钟：本仓前端改动频繁。紧急时可在 CF 后台 Purge。
    #   ⚠️ 用 `^~` 前缀匹配：它比所有正则 location 优先，不会被下面的
    #      OO/裸路径正则抢走。
    #   ⚠️ 不碰 `/web-apps/apps/api/documents/api.js` —— OO 自己设了
    #      `no-store` 是**有意**的（无版本号的入口文件，怕升级后错配），
    #      `_oo-cache.inc` 的注释也写明「api.js 永远 MISS（正确）」。
    # ----------------------------------------------------------------
    location ^~ /static/ {
        proxy_pass http://app_up;
        proxy_http_version 1.1;
        # 与 location / 保持完全一致的转发头（否则 _origin() 会拼错绝对地址）
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # 覆盖上游的 no-cache：必须先 hide 再 add，否则两个头会同时存在
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=3600" always;
    }

    # ----------------------------------------------------------------
    # ⓪b KK 的 3D 预览资源（/website/libs/*）—— 含 **7.6MB** 的 occt-import-js.wasm
    #
    #   上游 kkFileView 对这些文件**不给任何 Cache-Control** ⇒
    #   浏览器每次都重新下载 WASM 导入器（3D 预览必需）。
    #
    #   ⚠️⚠️ 关键事实（2026-10-03 实测）：**这里加头并不能让 CF 边缘缓存**。
    #      `.wasm` **不在 Cloudflare 的默认缓存扩展名列表**里，实测即使源站给了
    #      `public, max-age=604800, immutable`（cad-viewer 的 wasm 就是），
    #      CF 依然返回 `cf-cache-status: DYNAMIC`（= 判定为不可缓存）。
    #      要让 CF 缓存 wasm，**必须在 CF 后台建一条 Cache Rule**：
    #        Caching → Cache Rules → Create
    #          When: URI Path ends with `.wasm`
    #          Then: Cache eligibility = **Eligible for cache**
    #                Edge TTL = Override origin → 7 days
    #      （两个大文件都受益：/cad/assets/libredwg-web.wasm 9.9MB、
    #        /website/libs/occt-import-js.wasm 7.6MB。）
    #
    #   本 location 的作用是**浏览器层**能缓存 —— 同一会话内不重复下载。
    #   TTL 给 1 天（文件名不带 hash，KK 升级时 URL 不变，别设太长）。
    # ----------------------------------------------------------------
    location ^~ /website/ {
        proxy_pass http://app_up;
        proxy_http_version 1.1;
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        proxy_pass http://app_up;
        proxy_http_version 1.1;
        # ★ 用 $fwd_host / $fwd_proto（见文件顶部 map）：它们优先跟随 Referer,
        #   即「浏览器实际在用的 origin」。手机（飞牛 App webview）的 Host 被
        #   网关改写过，只有 Referer 还留着真实域名 —— 后端的 `_origin()`
        #   正是拿 X-Forwarded-Host 拼 apiJs 的绝对地址，拼错了手机就打不开编辑器。
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
