# =============================================================================
# kkFileView 同源反向代理配置（nginx）
#
# 目的：把 kkFileView 挂到业务系统同一个 origin 的子路径下，
#       业务页面里直接写 <iframe src="/kkfileview/onlinePreview?url=..."> 即可。
#
# 同源之后一次性消除 iframe 嵌入的三大坑：
#   1. 混合内容：HTTPS 页面里套 HTTP 预览页会被浏览器拦掉
#   2. 跨域：预览页内部发起的请求受同源策略限制
#   3. 第三方 Cookie：Samesite=Lax/Strict 下跨站 iframe 会话不生效
#
# 部署：把本文件放到 nginx 的 conf.d/ 下，
#       并保证 upstream 主机名 kkfileview 可解析（compose 服务名即 DNS 名）。
# =============================================================================

server {
    listen      80;
    server_name _;

    # 预览大文件需要放宽限制
    client_max_body_size 500m;
    proxy_connect_timeout 30s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # -------------------------------------------------------------------------
    # kkFileView 预览服务
    #   对外：/kkfileview/onlinePreview?url=xxx
    #   内部：http://kkfileview:8012/onlinePreview?url=xxx
    # -------------------------------------------------------------------------
    location /kkfileview/ {
        # 末尾这个 "/" 会把 /kkfileview 前缀剥掉再转发给应用
        proxy_pass http://kkfileview:8012/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host 也用 $http_host 透传原始值（含端口），
        # 避免应用按 Host 拼接地址时丢掉非标准端口。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # ★ 关键 ★
        # kkFileView 的 BaseUrlFilter 会优先读这个头来生成页面内的资源地址。
        # 不传的话，反向代理场景下会拼出 http://<容器名>:8012/... 这种
        # 浏览器访问不到的内网地址，表现就是 iframe 里一直白屏/转圈。
        # 末尾不要带 "/"，应用会自动补。
        #
        # ⚠️ 必须用 $http_host 而不是 $host：
        #    $host      = 只含主机名，**不含端口**（如 127.0.0.1）
        #    $http_host = 原始 Host 头，**含端口**（如 127.0.0.1:8090）
        # 对外端口不是 80/443 时，用 $host 会拼出 http://127.0.0.1/kkfileview/，
        # 浏览器会去请求 80 端口 → 预览页白屏。
        proxy_set_header X-Base-Url        $scheme://$http_host/kkfileview;

        # 大图片、视频拖动进度条时不缓冲，边转边发
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # 演示页（验证 iframe 嵌入是否正常）
    # -------------------------------------------------------------------------
    location / {
        root      /usr/share/nginx/html/demo;
        index     iframe-preview.html;
        try_files $uri $uri/ /iframe-preview.html;
    }

    # -------------------------------------------------------------------------
    # ⚠️ 注意：不要在这个 server 里加下面这类响应头
    #   add_header X-Frame-Options DENY;
    #   add_header X-Frame-Options SAMEORIGIN;
    #   add_header Content-Security-Policy "frame-ancestors 'self'";
    # 一旦加上，跨源 iframe 嵌入会被浏览器直接拒绝（报 refused to connect）。
    # kkFileView 自身不发送这些头，保持原样即可。
    # -------------------------------------------------------------------------
}
